<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08090d" />
    <title>SLR Studios</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #08090d; color: #f8fafc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 420px); text-align: center; }
      p { color: #bac0cc; line-height: 1.6; }
      a { min-height: 48px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 20px; border-radius: 12px; background: #7c3aed; color: white; font-weight: 700; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <h1>SLR Studios</h1>
      <p>Connect to the internet to open your studio.</p>
      <a href="https://comf-otg.comfyui-otg.win/app">Open SLR Studios</a>
    </main>
  </body>
</html>
