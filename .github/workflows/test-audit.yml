name: Offline application regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OTG_ENV: test
      OPENAI_KILL_SWITCH: "true"
      OTG_MEDIA_GPU_LIVE_QA: "0"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: node scripts/audit/run-offline-tests.cjs
      - run: npx tsc --noEmit --incremental false
      - run: npm audit --omit=dev --audit-level=high
